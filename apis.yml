apis:
- name: Alleva REST API
  description: >-
    The Alleva REST API ("Alleva Rest Api", OpenAPI 3.0.1) exposes 424 operations across 37 resource
    groups covering clients, prospects and intake, appointments and sessions, beds/rooms/occupancy and
    reservations, treatment plans and reviews, discharge plans, medications, documents, advanced forms
    and form instances, homework, surveys, shift rounds, incident reports, facilities, organizations,
    users and user licenses, referral companies and contacts, level of care, master codes, and data
    facets/values. Authentication is a JWT bearer token supplied in the Authorization header. The API is
    versioned three ways in parallel — an api-version query parameter, an X-Version header, and a
    /v{version}/ path prefix — and list endpoints use cursor pagination (Cursor + Limit) with optional
    StartDate/EndDate filtering and a sparse-fieldset `fields` parameter.
  humanURL: https://api.helloalleva.com/swagger/index.html
  baseURL: https://api.helloalleva.com
