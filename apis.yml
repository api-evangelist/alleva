aid: alleva
name: Alleva
description: >-
  Alleva is a behavioral health operations platform — an EMR/EHR, CRM, admissions, scheduling, clinical
  documentation, and revenue-cycle system purpose-built for substance use disorder and mental health
  treatment providers across the residential, PHP, IOP, and outpatient continuum. The platform covers
  client intake and prospect management, bed and facility census, treatment plans and reviews, discharge
  planning, medications and e-prescribe, group and individual sessions, shift rounds, incident reports,
  homework and surveys, and configurable advanced forms, with AI-assisted documentation (Echo ambient
  scribe, Alleva Intelligence) and a built-in GRC module (InCheck). A public ASP.NET REST API at
  api.helloalleva.com exposes 424 operations across 37 resource groups under JWT bearer authentication,
  with a publicly reachable Swagger UI and machine-readable OpenAPI 3.0.1 description. Alleva holds ONC
  Certification and SOC 2 Type II attestation and publishes a Vanta trust center and an Atlassian status
  page that tracks the REST API as a first-class component.
