openapi: 3.2.0
info:
  title: Alleva Rest Sessions API
  version: '1.0'
security:
- Bearer: []
tags:
- name: Sessions
paths:
  /sessions/{id}:
    get:
      tags:
      - Sessions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: expand
        in: query
        schema:
          type: boolean
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain; ver=1.0:
              schema:
                $ref: '#/components/schemas/Session'
            application/json; ver=1.0:
              schema:
                $ref: '#/components/schemas/Session'
            text/json; ver=1.0:
              schema:
                $ref: '#/components/schemas/Session'
    put:
      tags:
      - Sessions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json; ver=1.0:
            schema:
              $ref: '#/components/schemas/Session'
          application/json; ver=1.0:
            schema:
              $ref: '#/components/schemas/Session'
          text/json; ver=1.0:
            schema:
              $ref: '#/components/schemas/Session'
          application/*+json; ver=1.0:
            schema:
              $ref: '#/components/schemas/Session'
      responses:
        '200':
          description: Success
          content:
            text/plain; ver=1.0:
              schema:
                type: boolean
            application/json; ver=1.0:
              schema:
                type: boolean
            text/json; ver=1.0:
              schema:
                type: boolean
