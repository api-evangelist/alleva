components:
  schemas:
    ResourceLink:
      type: object
      properties:
        id:
          type: integer
          format: int32
        route:
          type:
          - string
          - 'null'
      additionalProperties: false
    DocumentTypeModal:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    Document:
      type: object
      properties:
        id:
          type: integer
          format: int32
        href:
          type:
          - string
          - 'null'
          readOnly: true
        clientDocumentId:
          type: integer
          format: int64
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        fileName:
          type:
          - string
          - 'null'
        client:
          $ref: '#/components/schemas/ResourceLink'
        status:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        typeId:
          type:
          - integer
          - 'null'
          format: int64
        uploadDate:
          type:
          - string
          - 'null'
          format: date-time
        url:
          $ref: '#/components/schemas/DocumentUrl'
        tableId:
          type:
          - integer
          - 'null'
          format: int64
        tableName:
          type:
          - string
          - 'null'
        path:
          type:
          - string
          - 'null'
        documentTypeId:
          type: integer
          format: int32
        uploadedDocuments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DocumentData'
      additionalProperties: false
    ExternalData:
      type: object
      properties:
        externalId:
          type:
          - string
          - 'null'
        externalIdType:
          type:
          - string
          - 'null'
        serviceIdentifier:
          type:
          - string
          - 'null'
        serviceId:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    DocumentData:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type:
          - string
          - 'null'
        base64String:
          type:
          - string
          - 'null'
        externalId:
          $ref: '#/components/schemas/ExternalData'
      additionalProperties: false
    DocumentUrl:
      type: object
      properties:
        fileName:
          type:
          - string
          - 'null'
        host:
          type:
          - string
          - 'null'
          readOnly: true
        path:
          type:
          - string
          - 'null'
          readOnly: true
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter Bearer [space] and then your token in the text input below.\n\nExample: Bearer 12345abcdef"
      name: Authorization
      in: header
