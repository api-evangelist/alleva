          type:
          - string
          - 'null'
        needs:
          type:
          - string
          - 'null'
        abilities:
          type:
          - string
          - 'null'
        preferences:
          type:
          - string
          - 'null'
        psychiatricTreatment:
          type:
          - string
          - 'null'
        individualTherapy:
          type:
          - string
          - 'null'
        familyTherapy:
          type:
          - string
          - 'null'
        milieu:
          type:
          - string
          - 'null'
        education:
          type:
          - string
          - 'null'
        recreation:
          type:
          - string
          - 'null'
        criticalEvents:
          type:
          - string
          - 'null'
        therapeuticAbsence:
          type:
          - string
          - 'null'
        anticipatedDischarge:
          type:
          - string
          - 'null'
        livingArrangements:
          type:
          - string
          - 'null'
        dischargeEducation:
          type:
          - string
          - 'null'
        dischargeTherapy:
          type:
          - string
          - 'null'
        dischargeObstacles:
          type:
          - string
          - 'null'
        dischargeFollow:
          type:
          - string
          - 'null'
        justificationTreatment:
          type:
          - string
          - 'null'
        generatedDate:
          type:
          - string
          - 'null'
        generatedTime:
          type:
          - string
          - 'null'
        ceratorSignature:
          type:
          - string
          - 'null'
        createdDated:
          type: string
          format: date-time
        clientSignature:
          type:
          - string
          - 'null'
        clientSignatureDate:
          type:
          - string
          - 'null'
        guardianSignature:
          type:
          - string
          - 'null'
        guardianSignatureDate:
          type:
          - string
          - 'null'
        creatorSignatureDate:
          type:
          - string
          - 'null'
        clientName:
          type:
          - string
          - 'null'
        ceratorName:
          type:
          - string
          - 'null'
        tpReviewNote:
          type:
          - string
          - 'null'
        nextReviewDue:
          type:
          - string
          - 'null'
        sortOrderSetting:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter Bearer [space] and then\
        \ your token in the text input below.\n\nExample: Bearer 12345abcdef"
      name: Authorization
      in: header
servers:
- url: https://api.helloalleva.com
  description: Base URL reconciled from apis.yml
