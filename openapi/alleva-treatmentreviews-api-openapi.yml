openapi: 3.2.0
info:
  title: Alleva Rest Treatment Reviews API
  version: '1.0'
security:
- Bearer: []
tags:
- name: TreatmentReviews
paths:
  /treatment-reviews:
    get:
      tags:
      - TreatmentReviews
      parameters:
      - name: Limit
        in: query
        schema:
          type: integer
          format: int64
      - name: Cursor
        in: query
        schema:
          type: integer
          format: int32
      - name: StartDate
        in: query
        schema:
          type: string
          format: date-time
      - name: EndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: fields
        in: query
        schema:
          type: array
          items:
            type: string
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TxReviewDetails'
            application/json; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TxReviewDetails'
            text/json; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TxReviewDetails'
  /v{version}/treatment-reviews:
    get:
      tags:
      - TreatmentReviews
      parameters:
      - name: Limit
        in: query
        schema:
          type: integer
          format: int64
      - name: Cursor
        in: query
        schema:
          type: integer
          format: int32
      - name: StartDate
        in: query
        schema:
          type: string
          format: date-time
      - name: EndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: fields
        in: query
        schema:
          type: array
          items:
            type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TxReviewDetails'
            application/json; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TxReviewDetails'
            text/json; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TxReviewDetails'
  /treatment-reviews/{id}:
    get:
      tags:
      - TreatmentReviews
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain; ver=1.0:
              schema:
                $ref: '#/components/schemas/TxReviewDetails'
            application/json; ver=1.0:
              schema:
                $ref: '#/components/schemas/TxReviewDetails'
            text/json; ver=1.0:
              schema:
                $ref: '#/components/schemas/TxReviewDetails'
  /v{version}/treatment-reviews/{id}:
    get:
      tags:
      - TreatmentReviews
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: version
        in: path
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain; ver=1.0:
              schema:
                $ref: '#/components/schemas/TxReviewDetails'
            application/json; ver=1.0:
              schema:
                $ref: '#/components/schemas/TxReviewDetails'
            text/json; ver=1.0:
              schema:
                $ref: '#/components/schemas/TxReviewDetails'
components:
