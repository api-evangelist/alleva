components:
  schemas:
    CreateOperationResult:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      format: int32
    CreateResult:
      type: object
      properties:
        operationResult:
          $ref: '#/components/schemas/CreateOperationResult'
        id:
          type:
          - integer
          - 'null'
          format: int64
        messages:
          type:
          - array
          - 'null'
          items:
            type: string
        reason:
          type:
          - string
          - 'null'
      additionalProperties: false
    SnapshotType:
      enum:
      - 1346
      - 1347
      - 1348
      - 1349
      - 1389
      - 1431
      - 1521
      type: integer
      format: int32
    Snapshot:
      type: object
      properties:
        id:
          type: integer
          format: int32
        href:
          type:
          - string
          - 'null'
          readOnly: true
        createdBy:
          type: integer
          format: int32
        createdDate:
          type: string
          format: date-time
        generatedFileName:
          type:
          - string
          - 'null'
        intakeType:
          type: integer
          format: int32
        isDeleted:
          type: boolean
        leadId:
          type: integer
          format: int64
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter Bearer [space] and then your token in the text input below.\n\nExample: Bearer 12345abcdef"
      name: Authorization
      in: header
