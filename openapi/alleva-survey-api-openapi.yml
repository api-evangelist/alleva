openapi: 3.2.0
info:
  title: Alleva Rest Survey API
  version: '1.0'
security:
- Bearer: []
tags:
- name: Survey
paths:
  /surveys/answers:
    post:
      tags:
      - Survey
      parameters:
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json; ver=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SurveyAnswer'
          application/json; ver=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SurveyAnswer'
          text/json; ver=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SurveyAnswer'
          application/*+json; ver=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SurveyAnswer'
      responses:
        '200':
          description: Success
      summary: Create surveys answers
      x-summary-source: derived
      operationId: postSurveysAnswers
      x-operation-id-source: derived
  /v{version}/surveys/answers:
    post:
      tags:
      - Survey
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json; ver=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SurveyAnswer'
          application/json; ver=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SurveyAnswer'
          text/json; ver=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SurveyAnswer'
          application/*+json; ver=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SurveyAnswer'
      responses:
        '200':
          description: Success
      summary: Create v{version} surveys answers
      x-summary-source: derived
      operationId: postV{version}SurveysAnswers
      x-operation-id-source: derived
  /surveys:
    get:
      tags:
      - Survey
      parameters:
      - name: Limit
        in: query
        schema:
          type: integer
          format: int64
      - name: Cursor
        in: query
        schema:
          type: integer
          format: int32
      - name: StartDate
        in: query
        schema:
          type: string
          format: date-time
      - name: EndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: fields
        in: query
        schema:
          type: array
          items:
            type: string
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Survey'
            application/json; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Survey'
            text/json; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Survey'
      summary: Get surveys
      x-summary-source: derived
      operationId: getSurveys
      x-operation-id-source: derived
  /v{version}/surveys:
    get:
      tags:
      - Survey
      parameters:
      - name: Limit
        in: query
        schema:
          type: integer
          format: int64
      - name: Cursor
        in: query
        schema:
          type: integer
          format: int32
      - name: StartDate
        in: query
        schema:
          type: string
          format: date-time
      - name: EndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: fields
        in: query
        schema:
          type: array
          items:
            type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Survey'
            application/json; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Survey'
            text/json; ver=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Survey'
      summary: Get v{version} surveys
      x-summary-source: derived
      operationId: getV{version}Surveys
      x-operation-id-source: derived
  /surveys/{id}:
    get:
      tags:
      - Survey
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain; ver=1.0:
              schema:
                $ref: '#/components/schemas/Survey'
            application/json; ver=1.0:
              schema:
                $ref: '#/components/schemas/Survey'
            text/json; ver=1.0:
              schema:
                $ref: '#/components/schemas/Survey'
      summary: Get surveys by id
      x-summary-source: derived
      operationId: getSurveysById
      x-operation-id-source: derived
  /v{version}/surveys/{id}:
    get:
      tags:
      - Survey
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: version
        in: path
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-Version
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain; ver=1.0:
              schema:
                $ref: '#/components/schemas/Survey'
            application/json; ver=1.0:
              schema:
                $ref: '#/components/schemas/Survey'
            text/json; ver=1.0:
              schema:
                $ref: '#/components/schemas/Survey'
      summary: Get v{version} surveys by id
      x-summary-source: derived
      operationId: getV{version}SurveysById
      x-operation-id-source: derived
components:
  schemas:
    SurveyAnswer:
      type: object
      properties:
        clientId:
          type: integer
          format: int32
        questionId:
          type: integer
          format: int32
        score:
          type: integer
          format: int32
        createdBy:
          type: integer
          format: int32
        explanation:
          type:
          - string
          - 'null'
        submittedDateTime:
          type: string
          format: date-time
      additionalProperties: false
    SurveyQuestion:
      type: object
      properties:
        questionId:
          type: integer
          format: int32
        question:
          type:
          - string
          - 'null'
      additionalProperties: false
    Survey:
      type: object
      properties:
        id:
          type: integer
          format: int32
        href:
          type:
          - string
          - 'null'
          readOnly: true
        title:
          type:
          - string
          - 'null'
        surveyQuestions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SurveyQuestion'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter Bearer [space] and then your token in the text input below.\n\nExample: Bearer 12345abcdef"
      name: Authorization
      in: header
