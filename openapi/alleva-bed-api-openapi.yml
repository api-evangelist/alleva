components:
  schemas:
    Bed:
      type: object
      properties:
        id:
          type: integer
          format: int32
        href:
          type:
          - string
          - 'null'
          readOnly: true
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        forFemale:
          type: boolean
        isActive:
          type: boolean
        isMaintenance:
          type: boolean
        isOccupied:
          type:
          - boolean
          - 'null'
        isReserved:
          type:
          - boolean
          - 'null'
        room:
          $ref: '#/components/schemas/Room'
      additionalProperties: false
    JToken:
      type: array
      items:
        $ref: '#/components/schemas/JToken'
    Room:
      type: object
      properties:
        id:
          type: integer
          format: int32
        href:
          type:
          - string
          - 'null'
          readOnly: true
        facilityId:
          type: integer
          format: int32
        roomName:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        totalBeds:
          type: integer
          format: int32
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter Bearer [space] and then your token in the text input below.\n\nExample: Bearer 12345abcdef"
      name: Authorization
      in: header
