          - 'null'
        last:
          type:
          - string
          - 'null'
        middle:
          type:
          - string
          - 'null'
        isLegalName:
          type:
          - boolean
          - 'null'
        former:
          type:
          - string
          - 'null'
        prefix:
          type:
          - string
          - 'null'
        preferred:
          type:
          - string
          - 'null'
      additionalProperties: false
    Occupant:
      type: object
      properties:
        leadId:
          type: integer
          format: int32
        name:
