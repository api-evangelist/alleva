          - 'null'
          format: date-time
        dischargeDate:
          type:
          - string
          - 'null'
          format: date-time
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date-time
        imageUrl:
          type:
          - string
          - 'null'
      additionalProperties: false
    OccupancyTransfer:
