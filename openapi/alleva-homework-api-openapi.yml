components:
  schemas:
    ResourceLink:
      type: object
      properties:
        id:
          type: integer
          format: int32
        route:
          type:
          - string
          - 'null'
      additionalProperties: false
    HomeworkNote:
      type: object
      properties:
        id:
          type: integer
          format: int32
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        note:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        createdById:
          type: integer
          format: int32
          writeOnly: true
        createdDate:
          type: string
          format: date-time
      additionalProperties: false
    Homework:
      type: object
      properties:
        id:
          type: integer
          format: int32
        href:
          type:
          - string
          - 'null'
          readOnly: true
        client:
          $ref: '#/components/schemas/ResourceLink'
        treatmentPlan:
          $ref: '#/components/schemas/ResourceLink'
        title:
          type:
          - string
          - 'null'
        goals:
          type:
          - string
          - 'null'
        suggestions:
          type:
          - string
          - 'null'
        isWiley:
          type: boolean
        fileName:
          type:
          - string
          - 'null'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type:
          - string
          - 'null'
        problem:
          type:
          - string
          - 'null'
        assignment:
          type:
          - string
          - 'null'
        notes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/HomeworkNote'
      additionalProperties: false
    JToken:
      type: array
      items:
        $ref: '#/components/schemas/JToken'
  securitySchemes:
    Bearer:
      type: apiKey
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter Bearer [space] and then\
        \ your token in the text input below.\n\nExample: Bearer 12345abcdef"
      name: Authorization
      in: header
servers:
- url: https://api.helloalleva.com
  description: Base URL reconciled from apis.yml
